<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1.0,user-scalable=no">

<title>カメレオンバブルパズル</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<div id="gameContainer">

    <canvas id="gameCanvas"></canvas>

    <div id="ui">

        <div id="topBar">

            <div class="panel">
                STAGE
                <span id="stageValue">1</span>
            </div>

            <div class="panel">
                SCORE
                <span id="scoreValue">0</span>
            </div>

        </div>

        <div id="leftInfo">

            <div class="panel">
                舌
                <span id="movesValue">30</span>
            </div>

            <div class="panel">
                ♻
                <span id="shuffleValue">3</span>
            </div>

        </div>

        <div id="comboText"></div>

        <div id="message"></div>

        <button id="startButton">
            START
        </button>

        <button id="shuffleButton">
            ♻️
        </button>

    </div>

</div>

<script src="game.js"></script>

</body>
</html>
