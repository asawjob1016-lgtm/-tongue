<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

<title>Chameleon's Tongue</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
-webkit-tap-highlight-color:transparent;
}

html,body{
width:100%;
height:100%;
overflow:hidden;
font-family:sans-serif;
background:#eaf9ff;
}

canvas{
display:block;
}

#titleScreen{
position:absolute;
left:0;
top:0;
width:100%;
height:100%;
background:linear-gradient(
to bottom,
#dff6ff,
#ffffff
);
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
z-index:100;
}

#gameTitle{
font-size:42px;
font-weight:bold;
color:#2e8b57;
text-align:center;
margin-bottom:20px;
}

#titleCanvas{
width:340px;
height:240px;
max-width:90%;
}

#startBtn{
margin-top:20px;
padding:18px 45px;
font-size:28px;
font-weight:bold;
border:none;
border-radius:18px;
background:#32cd32;
color:white;
box-shadow:0 4px 10px rgba(0,0,0,.2);
}

#ui{
position:absolute;
top:10px;
left:10px;
z-index:50;
display:none;
font-size:20px;
font-weight:bold;
color:#222;
}

#message{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
font-size:48px;
font-weight:bold;
color:white;
text-shadow:0 0 10px black;
display:none;
z-index:60;
}

</style>
</head>
<body>

<div id="titleScreen">

<div id="gameTitle">
Chameleon's Tongue
</div>

<canvas
id="titleCanvas"
width="400"
height="260">
</canvas>

<button id="startBtn">
START
</button>

</div>

<div id="ui">
Tongue :
<span id="moves">30</span>
&nbsp;&nbsp;
Stage :
<span id="stage">1</span>
</div>

<div id="message"></div>

<canvas id="gameCanvas"></canvas>

<script>

const canvas =
document.getElementById("gameCanvas");

const ctx =
canvas.getContext("2d");

function resize(){

canvas.width =
window.innerWidth;

canvas.height =
window.innerHeight;

}

resize();

window.addEventListener(
"resize",
resize
);

const titleCanvas =
document.getElementById("titleCanvas");

const tctx =
titleCanvas.getContext("2d");

function drawTitleChameleon(){

tctx.clearRect(
0,
0,
titleCanvas.width,
titleCanvas.height
);

tctx.save();

tctx.translate(40,20);

/* body */

tctx.fillStyle="#9ad67a";
tctx.strokeStyle="#4d9b4d";
tctx.lineWidth=8;

tctx.beginPath();

tctx.moveTo(60,150);

tctx.quadraticCurveTo(
120,
60,
250,
100
);

tctx.quadraticCurveTo(
290,
130,
220,
180
);

tctx.quadraticCurveTo(
110,
210,
60,
150
);

tctx.fill();
tctx.stroke();

/* tail */

tctx.beginPath();

tctx.arc(
40,
165,
35,
0,
Math.PI*2
);

tctx.stroke();

tctx.beginPath();

tctx.arc(
40,
165,
15,
0,
Math.PI*2
);

tctx.stroke();

/* head */

tctx.beginPath();

tctx.moveTo(
220,
95
);

tctx.lineTo(
310,
80
);

tctx.lineTo(
275,
130
);

tctx.closePath();

tctx.fill();
tctx.stroke();

/* eye */

tctx.fillStyle="white";

tctx.beginPath();

tctx.arc(
190,
85,
26,
0,
Math.PI*2
);

tctx.fill();

tctx.strokeStyle="#222";
tctx.lineWidth=3;
tctx.stroke();

tctx.fillStyle="black";

tctx.beginPath();

tctx.arc(
190,
85,
6,
0,
Math.PI*2
);

tctx.fill();

/* legs */

tctx.strokeStyle="#4d9b4d";
tctx.lineWidth=8;

for(let i=0;i<4;i++){

let x=110+(i*35);

tctx.beginPath();

tctx.moveTo(
x,
170
);

tctx.lineTo(
x,
205
);

tctx.stroke();

tctx.beginPath();

tctx.moveTo(
x,
205
);

tctx.lineTo(
x+18,
205
);

tctx.stroke();

}

/* tongue */

tctx.strokeStyle="red";
tctx.lineWidth=10;

tctx.beginPath();

tctx.moveTo(
275,
112
);

tctx.lineTo(
350,
95
);

tctx.stroke();

tctx.restore();

}

drawTitleChameleon();

/* game vars */

let stage=1;
let moves=30;

let gameStarted=false;

const colors=[
"#ff5a5a",
"#4aa3ff",
"#44cc66",
"#ffcc33",
"#b266ff"
];

const rows=12;
const cols=8;

let grid=[];
let bombs=[];

const cellSize=52;

const uiMoves=
document.getElementById("moves");

const uiStage=
document.getElementById("stage");

const message=
document.getElementById("message");
