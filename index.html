<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1,
maximum-scale=1,
user-scalable=no">

<title>Chameleon's Tongue</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html,
body{
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:sans-serif;
  background:#eaf9ff;
  touch-action:none;
}

button{
  border:none;
  cursor:pointer;
  -webkit-tap-highlight-color:transparent;
}

/* ==================================================
   TITLE
================================================== */

#titleScreen{

  position:fixed;
  inset:0;

  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;

  background:
    linear-gradient(
      180deg,
      #d8f7ff,
      #ffffff
    );

  z-index:1000;
}

#gameTitle{

  font-size:42px;
  font-weight:bold;

  color:#2d8f5a;

  text-align:center;

  margin-bottom:8px;
}

#subTitle{

  font-size:22px;

  color:#666;

  margin-bottom:20px;
}

#titleCanvas{

  width:340px;
  height:240px;

  max-width:90%;
}

#startBtn,
#restartBtn{

  margin-top:20px;

  padding:16px 48px;

  font-size:26px;
  font-weight:bold;

  border-radius:20px;

  background:#37c96b;
  color:white;

  box-shadow:
    0 5px 15px rgba(0,0,0,.2);
}

#startBtn:active,
#restartBtn:active{

  transform:scale(.95);
}


/* ==================================================
   INTRO
================================================== */

#introScreen{

  position:fixed;
  inset:0;

  display:none;

  flex-direction:column;
  justify-content:center;
  align-items:center;

  background:
    linear-gradient(
      180deg,
      #d8f7ff,
      #ffffff
    );

  z-index:1500;
}

#introCanvas{

  width:360px;
  height:360px;

  max-width:90%;
}

#introText{

  min-height:60px;

  margin-top:5px;

  font-size:24px;
  font-weight:bold;

  color:#555;

  text-align:center;
}

#introNextBtn{

  margin-top:15px;

  padding:12px 35px;

  font-size:20px;
  font-weight:bold;

  border-radius:18px;

  background:#37c96b;
  color:white;

  box-shadow:
    0 4px 12px rgba(0,0,0,.15);
}

#introNextBtn:active{

  transform:scale(.95);
}

#introSkip{

  margin-top:10px;

  padding:8px 20px;

  font-size:15px;

  background:transparent;

  color:#888;
}


/* ==================================================
   GAME
================================================== */

#gameScreen{

  display:none;

  position:fixed;
  inset:0;
}

#gameCanvas{

  display:block;

  width:100%;
  height:100%;

  background:
    linear-gradient(
      180deg,
      #dff6ff,
      #ffffff
    );
}


/* ==================================================
   UI
================================================== */

#ui{

  position:absolute;

  top:10px;
  left:50%;

  transform:translateX(-50%);

  z-index:100;

  display:flex;
  align-items:center;

  gap:16px;

  padding:9px 18px;

  border-radius:20px;

  background:
    rgba(255,255,255,.92);

  box-shadow:
    0 3px 10px rgba(0,0,0,.12);

  font-size:19px;
  font-weight:bold;

  color:#333;

  white-space:nowrap;
}

#moves{
  color:#e94d4d;
}

#timer{
  color:#2d8f5a;
}


/* ==================================================
   RESULT
================================================== */

#resultScreen{

  position:absolute;
  inset:0;

  display:none;

  flex-direction:column;
  justify-content:center;
  align-items:center;

  background:
    rgba(255,255,255,.91);

  z-index:500;
}

#resultTitle{

  font-size:48px;
  font-weight:bold;

  color:#2d8f5a;

  margin-bottom:10px;
}

#resultText{

  font-size:22px;

  color:#555;

  text-align:center;

  margin-bottom:10px;
}

</style>
</head>


<body>


<!-- ==================================================
     TITLE
================================================== -->

<div id="titleScreen">

  <div id="gameTitle">
    Chameleon's Tongue
  </div>

  <div id="subTitle">
    Bubble Puzzle
  </div>

  <canvas
    id="titleCanvas"
    width="400"
    height="260">
  </canvas>

  <button id="startBtn">
    START
  </button>

</div>


<!-- ==================================================
     INTRO
================================================== -->

<div id="introScreen">

  <canvas
    id="introCanvas"
    width="400"
    height="400">
  </canvas>

  <div id="introText"></div>

  <button id="introNextBtn">
    NEXT
  </button>

  <button id="introSkip">
    SKIP
  </button>

</div>


<!-- ==================================================
     GAME
================================================== -->

<div id="gameScreen">

  <div id="ui">

    <span>
      Tongue :
      <span id="moves">30</span>
    </span>

    <span>
      Next :
      <span id="timer">4.5</span>
    </span>

  </div>

  <canvas id="gameCanvas"></canvas>

  <div id="resultScreen">

    <div id="resultTitle">
      CLEAR!
    </div>

    <div id="resultText">
      All bubbles cleared!
    </div>

    <button id="restartBtn">
      PLAY AGAIN
    </button>

  </div>

</div>


<script>

/* ==================================================
   TITLE CHAMELEON
================================================== */

const titleCanvas =
  document.getElementById("titleCanvas");

const titleCtx =
  titleCanvas.getContext("2d");


function drawTitleChameleon(){

  titleCtx.clearRect(
    0,
    0,
    titleCanvas.width,
    titleCanvas.height
  );

  titleCtx.save();

  titleCtx.translate(40,20);


  /* body */

  titleCtx.fillStyle="#9be17f";
  titleCtx.strokeStyle="#58a84a";
  titleCtx.lineWidth=6;

  titleCtx.beginPath();

  titleCtx.moveTo(50,140);

  titleCtx.quadraticCurveTo(
    120,40,
    250,80
  );

  titleCtx.quadraticCurveTo(
    320,110,
    280,160
  );

  titleCtx.quadraticCurveTo(
    180,190,
    80,170
  );

  titleCtx.closePath();

  titleCtx.fill();
  titleCtx.stroke();


  /* tail */

  titleCtx.beginPath();

  titleCtx.arc(
    40,
    150,
    35,
    0,
    Math.PI*2
  );

  titleCtx.stroke();

  titleCtx.beginPath();

  titleCtx.arc(
    40,
    150,
    18,
    0,
    Math.PI*2
  );

  titleCtx.stroke();


  /* eye */

  titleCtx.fillStyle="white";

  titleCtx.beginPath();

  titleCtx.arc(
    240,
    90,
    22,
    0,
    Math.PI*2
  );

  titleCtx.fill();

  titleCtx.strokeStyle="#333";

  titleCtx.stroke();

  titleCtx.fillStyle="#222";

  titleCtx.beginPath();

  titleCtx.arc(
    245,
    90,
    6,
    0,
    Math.PI*2
  );

  titleCtx.fill();


  /* mouth */

  titleCtx.strokeStyle="#397d3e";
  titleCtx.lineWidth=5;

  titleCtx.beginPath();

  titleCtx.arc(
    280,
    120,
    14,
    0.1,
    Math.PI-0.1
  );

  titleCtx.stroke();


  /* tongue */

  titleCtx.strokeStyle="#ff4d4d";
  titleCtx.lineWidth=9;

  titleCtx.beginPath();

  titleCtx.moveTo(
    288,
    125
  );

  titleCtx.lineTo(
    360,
    98
  );

  titleCtx.stroke();


  /* legs */

  titleCtx.strokeStyle="#58a84a";
  titleCtx.lineWidth=8;

  titleCtx.beginPath();

  titleCtx.moveTo(120,165);
  titleCtx.lineTo(110,205);

  titleCtx.moveTo(170,165);
  titleCtx.lineTo(160,205);

  titleCtx.moveTo(220,165);
  titleCtx.lineTo(210,205);

  titleCtx.moveTo(260,160);
  titleCtx.lineTo(250,200);

  titleCtx.stroke();

  titleCtx.restore();
}


drawTitleChameleon();


/* ==================================================
   INTRO
================================================== */

const introCanvas =
  document.getElementById("introCanvas");

const introCtx =
  introCanvas.getContext("2d");

const introText =
  document.getElementById("introText");

const introNextBtn =
  document.getElementById("introNextBtn");

const introSkip =
  document.getElementById("introSkip");


let introIndex=0;


const introScenes=[

  "ある いいてんきの ひ。",

  "おなかすいた。",

  "あっ！ たべもの？",

  "これは……とどくかな？",

  "びよーーーん！",

  "あれ？ とれない。",

  "3こ つながってる！",

  "これなら とれそう！"

];


/* ==================================================
   SHOW INTRO
================================================== */

function showIntro(){

  document
    .getElementById("titleScreen")
    .style.display="none";

  document
    .getElementById("gameScreen")
    .style.display="none";

  document
    .getElementById("introScreen")
    .style.display="flex";

  introIndex=0;

  showIntroScene();
}


/* ==================================================
   SHOW INTRO SCENE
================================================== */

function showIntroScene(){

  introText.textContent =
    introScenes[introIndex];

  drawIntro();

  if(
    introIndex===
    introScenes.length-1
  ){

    introNextBtn.textContent =
      "LET'S EAT!";

  }else{

    introNextBtn.textContent =
      "NEXT";
  }
}


/* ==================================================
   INTRO NEXT
================================================== */

introNextBtn.addEventListener(
  "click",
  ()=>{

    introIndex++;

    if(
      introIndex>=
      introScenes.length
    ){

      document
        .getElementById("introScreen")
        .style.display="none";

      startGame();

      return;
    }

    showIntroScene();
  }
);


/* ==================================================
   INTRO SKIP
================================================== */

introSkip.addEventListener(
  "click",
  ()=>{

    document
      .getElementById("introScreen")
      .style.display="none";

    startGame();
  }
);


/* ==================================================
   DRAW INTRO
================================================== */

function drawIntro(){

  introCtx.clearRect(
    0,
    0,
    introCanvas.width,
    introCanvas.height
  );


  /* sky */

  const gradient =
    introCtx.createLinearGradient(
      0,
      0,
      0,
      introCanvas.height
    );

  gradient.addColorStop(
    0,
    "#d8f7ff"
  );

  gradient.addColorStop(
    1,
    "#ffffff"
  );

  introCtx.fillStyle=gradient;

  introCtx.fillRect(
    0,
    0,
    introCanvas.width,
    introCanvas.height
  );


  /* clouds */

  drawIntroCloud(
    70,
    65,
    1
  );

  drawIntroCloud(
    320,
    120,
    .7
  );


  /* ground */

  introCtx.fillStyle="#a7e88f";

  introCtx.fillRect(
    0,
    330,
    400,
    70
  );


  /* chameleon */

  drawIntroChameleon();


  /* bubbles */

  if(introIndex>=2){

    drawIntroBubbles();
  }
}


/* ==================================================
   INTRO CHAMELEON
================================================== */

function drawIntroChameleon(){

  const x=105;
  const y=275;


  /* tail */

  introCtx.strokeStyle="#58a84a";
  introCtx.lineWidth=7;

  introCtx.beginPath();

  introCtx.arc(
    x-55,
    y,
    30,
    0,
    Math.PI*1.7
  );

  introCtx.stroke();


  /* body */

  introCtx.fillStyle="#8fdc77";
  introCtx.strokeStyle="#58a84a";
  introCtx.lineWidth=5;

  introCtx.beginPath();

  introCtx.ellipse(
    x,
    y,
    65,
    40,
    0,
    0,
    Math.PI*2
  );

  introCtx.fill();
  introCtx.stroke();


  /* head */

  introCtx.beginPath();

  introCtx.arc(
    x+55,
    y-30,
    27,
    0,
    Math.PI*2
  );

  introCtx.fill();
  introCtx.stroke();


  /* eye */

  introCtx.fillStyle="white";

  introCtx.beginPath();

  introCtx.arc(
    x+65,
    y-39,
    15,
    0,
    Math.PI*2
  );

  introCtx.fill();

  introCtx.strokeStyle="#333";

  introCtx.stroke();

  introCtx.fillStyle="#222";

  introCtx.beginPath();

  introCtx.arc(
    x+68,
    y-39,
    5,
    0,
    Math.PI*2
  );

  introCtx.fill();


  /* mouth */

  introCtx.strokeStyle="#397d3e";
  introCtx.lineWidth=4;

  introCtx.beginPath();

  introCtx.arc(
    x+68,
    y-15,
    14,
    0.1,
    Math.PI-0.1
  );

  introCtx.stroke();


  /* legs */

  introCtx.strokeStyle="#58a84a";
  introCtx.lineWidth=6;

  introCtx.beginPath();

  introCtx.moveTo(
    x-30,
    y+27
  );

  introCtx.lineTo(
    x-40,
    y+55
  );

  introCtx.moveTo(
    x+15,
    y+28
  );

  introCtx.lineTo(
    x+10,
    y+55
  );

  introCtx.stroke();


  /* tongue */

  if(introIndex>=4){

    introCtx.strokeStyle="#ff5555";
    introCtx.lineWidth=8;
    introCtx.lineCap="round";

    introCtx.beginPath();

    introCtx.moveTo(
      x+68,
      y-15
    );

    introCtx.lineTo(
      330,
      190
    );

    introCtx.stroke();
  }
}


/* ==================================================
   INTRO BUBBLES
================================================== */

function drawIntroBubbles(){

  drawIntroBubble(
    300,
    145,
    "#ff5a5a"
  );

  drawIntroBubble(
    340,
    145,
    "#4dabff"
  );

  drawIntroBubble(
    320,
    185,
    "#ffd43b"
  );


  if(introIndex>=6){

    drawIntroBubble(
      285,
      185,
      "#ffd43b"
    );

    drawIntroBubble(
      355,
      185,
      "#ffd43b"
    );
  }
}


/* ==================================================
   INTRO BUBBLE
================================================== */

function drawIntroBubble(
  x,
  y,
  color
){

  introCtx.beginPath();

  introCtx.fillStyle=color;

  introCtx.arc(
    x,
    y,
    22,
    0,
    Math.PI*2
  );

  introCtx.fill();

  introCtx.strokeStyle="white";
  introCtx.lineWidth=3;

  introCtx.stroke();


  /* shine */

  introCtx.beginPath();

  introCtx.fillStyle=
    "rgba(255,255,255,.65)";

  introCtx.arc(
    x-7,
    y-8,
    5,
    0,
    Math.PI*2
  );

  introCtx.fill();
}


/* ==================================================
   INTRO CLOUD
================================================== */

function drawIntroCloud(
  x,
  y,
  scale
){

  introCtx.save();

  introCtx.translate(
    x,
    y
  );

  introCtx.scale(
    scale,
    scale
  );

  introCtx.fillStyle=
    "rgba(255,255,255,.8)";

  introCtx.beginPath();

  introCtx.arc(
    0,
    10,
    25,
    0,
    Math.PI*2
  );

  introCtx.arc(
    30,
    0,
    32,
    0,
    Math.PI*2
  );

  introCtx.arc(
    65,
    12,
    25,
    0,
    Math.PI*2
  );

  introCtx.fill();

  introCtx.restore();
}


/* ==================================================
   GAME SETTINGS
================================================== */

const COLS=7;

const ROWS=10;

const INITIAL_ROWS=5;

const DROP_INTERVAL=3000;

const MAX_MOVES=30;


const COLORS=[

  "#ff5a5a",

  "#4dabff",

  "#ffd43b",

  "#69db7c"

];


/* ==================================================
   GAME VARIABLES
================================================== */

let gameCanvas=null;
let gameCtx=null;

let board=[];

let cellSize=50;

let boardLeft=0;
let boardTop=72;

let moves=MAX_MOVES;

let gameState="title";

let dropTimer=DROP_INTERVAL;

let lastTime=0;

let animationId=null;

let fallingBubbles=[];

let rescueTimer=null;


/* ==================================================
   TONGUE
================================================== */

let tongue={

  active:false,

  progress:0,

  startX:0,
  startY:0,

  targetX:0,
  targetY:0,

  group:null
};


/* ==================================================
   START / RESTART
================================================== */

document
  .getElementById("startBtn")
  .addEventListener(
    "click",
    showIntro
  );


document
  .getElementById("restartBtn")
  .addEventListener(
    "click",
    startGame
  );


function startGame(){

  document
    .getElementById("titleScreen")
    .style.display="none";

  document
    .getElementById("introScreen")
    .style.display="none";

  document
    .getElementById("gameScreen")
    .style.display="block";

  document
    .getElementById("resultScreen")
    .style.display="none";


  gameCanvas=
    document.getElementById("gameCanvas");

  gameCtx=
    gameCanvas.getContext("2d");


  moves=MAX_MOVES;

  gameState="playing";

  dropTimer=DROP_INTERVAL;

  lastTime=performance.now();


  document
    .getElementById("moves")
    .textContent=moves;


  document
    .getElementById("timer")
    .textContent=
    (DROP_INTERVAL/1000).toFixed(1);


  fallingBubbles=[];

  tongue.active=false;
  tongue.group=null;


  resizeGame();

  createBoard();


  /*

    初期盤面に
    必ず最低1つの
    3個グループを確保

  */

  ensurePlayableBoard();


  gameCanvas.onpointerdown=
    tapBubble;


  if(animationId){

    cancelAnimationFrame(
      animationId
    );
  }


  animationId=
    requestAnimationFrame(loop);
}


/* ==================================================
   RESIZE
================================================== */

function resizeGame(){

  if(!gameCanvas)
    return;


  gameCanvas.width=
    window.innerWidth;

  gameCanvas.height=
    window.innerHeight;


  cellSize=
    Math.min(
      54,
      (gameCanvas.width-20)/COLS
    );


  boardLeft=
    (
      gameCanvas.width-
      cellSize*COLS
    )/2;


  boardTop=72;
}


/* ==================================================
   CREATE BOARD
================================================== */

function createBoard(){

  board=[];

  for(
    let row=0;
    row<ROWS;
    row++
  ){

    board[row]=[];

    for(
      let col=0;
      col<COLS;
      col++
    ){

      if(row<INITIAL_ROWS){

        board[row][col]=
          createBubble(
            row,
            col,
            true
          );

      }else{

        board[row][col]=null;
      }
    }
  }


  updatePositions();


  for(
    let row=0;
    row<ROWS;
    row++
  ){

    for(
      let col=0;
      col<COLS;
      col++
    ){

      const b=
        board[row][col];

      if(!b)
        continue;

      b.y=b.targetY;

      b.falling=false;
    }
  }
}


/* ==================================================
   CREATE BUBBLE
================================================== */

function createBubble(
  row,
  col,
  visible
){

  return{

    row:row,
    col:col,

    color:randomColor(),

    x:0,

    y:
      visible
      ? 0
      : boardTop-cellSize,

    targetY:0,

    scale:1,

    falling:false,

    removing:false,

    fallVelocity:0,

    detached:false
  };
}


/* ==================================================
   RANDOM COLOR
================================================== */

function randomColor(){

  return COLORS[
    Math.floor(
      Math.random()*COLORS.length
    )
  ];
}


/* ==================================================
   UPDATE POSITIONS
================================================== */

function updatePositions(){

  if(!gameCanvas)
    return;


  for(
    let row=0;
    row<ROWS;
    row++
  ){

    for(
      let col=0;
      col<COLS;
      col++
    ){

      const b=
        board[row][col];

      if(!b)
        continue;


      b.x=
        boardLeft+
        col*cellSize+
        cellSize/2;


      b.targetY=
        boardTop+
        row*cellSize+
        cellSize/2;


      if(
        !b.falling &&
        !b.removing
      ){

        b.y=b.targetY;
      }
    }
  }
}


/* ==================================================
   DRAW BUBBLE
================================================== */

function drawBubble(b){

  if(!b)
    return;

  if(b.scale<=0)
    return;


  gameCtx.save();


  gameCtx.translate(
    b.x,
    b.y
  );


  gameCtx.scale(
    b.scale,
    b.scale
  );


  const radius=
    cellSize*.41;


  /* shadow */

  gameCtx.beginPath();

  gameCtx.fillStyle=
    "rgba(0,0,0,.12)";

  gameCtx.arc(
    3,
    4,
    radius,
    0,
    Math.PI*2
  );

  gameCtx.fill();


  /* bubble */

  gameCtx.beginPath();

  gameCtx.fillStyle=
    b.color;

  gameCtx.arc(
    0,
    0,
    radius,
    0,
    Math.PI*2
  );

  gameCtx.fill();


  /* border */

  gameCtx.strokeStyle=
    "rgba(255,255,255,.9)";

  gameCtx.lineWidth=3;

  gameCtx.stroke();


  /* shine */

  gameCtx.beginPath();

  gameCtx.fillStyle=
    "rgba(255,255,255,.65)";

  gameCtx.arc(
    -radius*.32,
    -radius*.38,
    radius*.18,
    0,
    Math.PI*2
  );

  gameCtx.fill();


  gameCtx.restore();
}


/* ==================================================
   CHAMELEON MOUTH
================================================== */

function getChameleonMouth(){

  const x=82;

  const y=
    gameCanvas.height-72;


  return{

    x:x+62,

    y:y-14
  };
}


/* ==================================================
   DRAW CHAMELEON
================================================== */

function drawChameleon(){

  const x=82;

  const y=
    gameCanvas.height-72;


  /* tail */

  gameCtx.strokeStyle="#58a84a";
  gameCtx.lineWidth=7;

  gameCtx.beginPath();

  gameCtx.arc(
    x-45,
    y,
    30,
    0,
    Math.PI*1.7
  );

  gameCtx.stroke();


  /* body */

  gameCtx.fillStyle="#8fdc77";
  gameCtx.strokeStyle="#58a84a";
  gameCtx.lineWidth=4;

  gameCtx.beginPath();

  );

  );

  );

  gameCtx.strokeStyle="#333";

  gameCtx.stroke();

  gameCtx.beginPath();

  gameCtx.arc(

  );

  );

}


/* ==================================================
   DRAW TONGUE
================================================== */

function drawTongue(){

  if(!tongue.active)
    return;


  const p=
    Math.max(
      0,
      Math.min(
        1,
        tongue.progress
      )
    );


  let reach;


  if(p<0.5){

    reach=p/0.5;

  }else{

    reach=1;
  }


  const x=
    tongue.startX+
    (
      tongue.targetX-
      tongue.startX
    )*
    reach;


  const y=
    tongue.startY+
    (
      tongue.targetY-
      tongue.startY
    )*
    reach;


  gameCtx.save();


  gameCtx.strokeStyle="#ff5555";
  gameCtx.lineWidth=8;
  gameCtx.lineCap="round";

  gameCtx.beginPath();

  gameCtx.moveTo(
    tongue.startX,
    tongue.startY
  );

  gameCtx.lineTo(
    x,
    y
  );

  gameCtx.stroke();


  gameCtx.fillStyle="#ff7777";

  gameCtx.beginPath();

  gameCtx.arc(
    x,
    y,
    7,
    0,
    Math.PI*2
  );

  gameCtx.fill();


  gameCtx.restore();
}


/* ==================================================
   TAP BUBBLE
================================================== */

function tapBubble(e){

  if(gameState!=="playing")
    return;

  if(tongue.active)
    return;

  if(moves<=0)
    return;


  const rect=
    gameCanvas.getBoundingClientRect();


  const mx=
    e.clientX-rect.left;

  const my=
    e.clientY-rect.top;


  const col=
    Math.floor(
      (mx-boardLeft)/
      cellSize
    );


  const row=
    Math.floor(
      (my-boardTop)/
      cellSize
    );


  if(
    row<0 ||
    row>=ROWS ||
    col<0 ||
    col>=COLS
  ){

    return;
  }


  const bubble=
    board[row][col];


  if(!bubble)
    return;


  const group=
    findSameColorGroup(
      row,
      col
    );


  if(group.length<3){

    return;
  }


  moves--;


  document
    .getElementById("moves")
    .textContent=moves;


  const mouth=
    getChameleonMouth();


  tongue.startX=
    mouth.x;

  tongue.startY=
    mouth.y;

  tongue.targetX=
    bubble.x;

  tongue.targetY=
    bubble.y;

  tongue.group=
    group;

  tongue.progress=0;

  tongue.active=true;
}


/* ==================================================
   FIND SAME COLOR GROUP
================================================== */

function findSameColorGroup(
  startRow,
  startCol
){

  const start=
    board[startRow][startCol];


  if(!start)
    return [];


  const color=
    start.color;


  const result=[];

  const visited=
    new Set();


  const queue=[
    [startRow,startCol]
  ];


  while(queue.length){

    const current=
      queue.shift();


    const row=
      current[0];

    const col=
      current[1];


    if(
      row<0 ||
      row>=ROWS ||
      col<0 ||
      col>=COLS
    ){

      continue;
    }


    const key=
      row+","+col;


    if(visited.has(key))
      continue;


    visited.add(key);


    const b=
      board[row][col];


    if(!b)
      continue;


    if(b.color!==color)
      continue;


    result.push({
      row:row,
      col:col
    });


    queue.push([
      row-1,
      col
    ]);

    queue.push([
      row+1,
      col
    ]);

    queue.push([
      row,
      col-1
    ]);

    queue.push([
      row,
      col+1
    ]);
  }


  return result;
}


/* ==================================================
   CHECK PLAYABLE
================================================== */

function hasPlayableGroup(){

  for(
    let row=0;
    row<ROWS;
    row++
  ){

    for(
      let col=0;
      col<COLS;
      col++
    ){

      const b=
        board[row][col];


      if(!b)
        continue;


      const group=
        findSameColorGroup(
          row,
          col
        );


      if(group.length>=3){

        return true;
      }
    }
  }


  return false;
}


/* ==================================================
   RESCUE DEADLOCK
================================================== */

function ensurePlayableBoard(){

  if(gameState!=="playing")
    return;


  if(hasPlayableGroup())
    return;


  const occupied=[];


  for(
    let row=0;
    row<ROWS;
    row++
  ){

    for(
      let col=0;
      col<COLS;
      col++
    ){

      if(board[row][col]){

        occupied.push({
          row:row,
          col:col
        });
      }
    }
  }


  if(occupied.length<3){

    return;
  }


  /*
    まず既に隣接している
    3マスを探す。

    見つけた場合は
    その3つの色だけを変更。
  */


  for(
    let row=0;
    row<ROWS;
    row++
  ){

    for(
      let col=0;
      col<COLS-2;
      col++
    ){

      if(
        board[row][col] &&
        board[row][col+1] &&
        board[row][col+2]
      ){

        const color=
          board[row][col].color;

        board[row][col+1].color=color;
        board[row][col+2].color=color;

        updatePositions();

        return;
      }
    }
  }


  for(
    let row=0;
    row<ROWS-2;
    row++
  ){

    for(
      let col=0;
      col<COLS;
      col++
    ){

      if(
        board[row][col] &&
        board[row+1][col] &&
        board[row+2][col]
      ){

        const color=
          board[row][col].color;

        board[row+1][col].color=color;
        board[row+2][col].color=color;

        updatePositions();

        return;
      }
    }
  }


  /*
    既存の隣接3マスがない場合。

    空いている3マスを探して
    バブル3個だけ移動。

    全盤面シャッフルはしない。
  */


  let targetCells=null;


  for(
    let row=0;
    row<ROWS;
    row++
  ){

    for(
      let col=0;
      col<COLS-2;
      col++
    ){

      if(
        !board[row][col] &&
        !board[row][col+1] &&
        !board[row][col+2]
      ){

        targetCells=[
          {row:row,col:col},
          {row:row,col:col+1},
          {row:row,col:col+2}
        ];

        break;
      }
    }

    if(targetCells)
      break;
  }


  if(!targetCells){

    for(
      let row=0;
      row<ROWS-2;
      row++
    ){

      for(
        let col=0;
        col<COLS;
        col++
      ){

        if(
          !board[row][col] &&
          !board[row+1][col] &&
          !board[row+2][col]
        ){

          targetCells=[
            {row:row,col:col},
            {row:row+1,col:col},
            {row:row+2,col:col}
          ];

          break;
        }
      }

      if(targetCells)
        break;
    }
  }


  if(!targetCells){

    /*
      完全に空きがない場合は
      最小限、3個の色だけ変更。
    */

    const first=
      occupied[0];

    const second=
      occupied[1];

    const third=
      occupied[2];


    const color=
      board[first.row][first.col].color;


    board[second.row][second.col].color=color;
    board[third.row][third.col].color=color;

    return;
  }


  const chosen=[];


  for(let i=0;i<3;i++){

    const pos=
      occupied[
        occupied.length-1-i
      ];

    const b=
      board[pos.row][pos.col];

    if(b){

      board[pos.row][pos.col]=null;

      chosen.push(b);
    }
  }


  for(
    let i=0;
    i<3;
    i++
  ){

    const cell=
      targetCells[i];

    const b=
      chosen[i];

    if(!b)
      continue;


    b.row=cell.row;
    b.col=cell.col;

    b.color=
      chosen[0].color;

    b.falling=false;
    b.removing=false;
    b.detached=false;

    board[cell.row][cell.col]=b;
  }


  updatePositions();
}


/* ==================================================
   REMOVE GROUP
================================================== */

function removeGroup(group){

  for(const pos of group){

    const b=
      board[pos.row][pos.col];


    if(!b)
      continue;


    b.removing=true;
  }
}


/* ==================================================
   COMPACT COLUMNS
================================================== */

/*

  消した場所を詰める。

  このゲームでは
  バブルは「上から積まれる」ので、
  各列を上方向へ詰める。

*/

function compactColumns(){

  for(
    let col=0;
    col<COLS;
    col++
  ){

    const bubbles=[];


    for(
      let row=0;
      row<ROWS;
      row++
    ){

      const b=
        board[row][col];


      if(
        b &&
        !b.removing
      ){

        bubbles.push(b);
      }
    }


    for(
      let row=0;
      row<ROWS;
      row++
    ){

      board[row][col]=null;
    }


    for(
      let row=0;
      row<bubbles.length;
      row++
    ){

      const b=
        bubbles[row];


      b.row=row;
      b.col=col;

      b.falling=true;
      b.removing=false;
      b.detached=false;

      board[row][col]=b;
    }
  }


  updatePositions();
}


/* ==================================================
   FIND TOP CONNECTED
================================================== */

function findTopConnected(){

  const connected=
    new Set();

  const queue=[];


  /*
    一番上の段を支柱にする
  */

  for(
    let col=0;
    col<COLS;
    col++
  ){

    if(board[0][col]){

      queue.push([
        0,
        col
      ]);
    }
  }


  while(queue.length){

    const current=
      queue.shift();


    const row=
      current[0];

    const col=
      current[1];


    if(
      row<0 ||
      row>=ROWS ||
      col<0 ||
      col>=COLS
    ){

      continue;
    }


    const key=
      row+","+col;


    if(connected.has(key))
      continue;


    const b=
      board[row][col];


    if(!b)
      continue;


    connected.add(key);


    queue.push([
      row-1,
      col
    ]);

    queue.push([
      row+1,
      col
    ]);

    queue.push([
      row,
      col-1
    ]);

    queue.push([
      row,
      col+1
    ]);
  }


  return connected;
}


/* ==================================================
   FIND FLOATING
================================================== */

function findFloating(){

  const connected=
    findTopConnected();

  const floating=[];


  for(
    let row=0;
    row<ROWS;
    row++
  ){

    for(
      let col=0;
      col<COLS;
      col++
    ){

      const b=
        board[row][col];


      if(!b)
        continue;


      const key=
        row+","+col;


      if(!connected.has(key)){

        floating.push({
          row:row,
          col:col
        });
      }
    }
  }


  return floating;
}


/* ==================================================
   DROP FLOATING
================================================== */

function dropFloatingBubbles(){

  const floating=
    findFloating();


  if(floating.length===0){

    return false;
  }


  for(const pos of floating){

    const b=
      board[pos.row][pos.col];


    if(!b)
      continue;


    b.detached=true;

    b.falling=true;

    b.fallVelocity=0;


    fallingBubbles.push(b);


    board[pos.row][pos.col]=null;
  }


  return true;
}


/* ==================================================
   FALLING BUBBLES
================================================== */

function updateFallingBubbles(delta){

  for(
    let i=fallingBubbles.length-1;
    i>=0;
    i--
  ){

    const b=
      fallingBubbles[i];


    b.fallVelocity +=
      0.0012*delta;


    b.y +=
      b.fallVelocity*delta;


    if(
      b.y>
      gameCanvas.height+
      cellSize
    ){

      fallingBubbles.splice(
        i,
        1
      );
    }
  }
}


/* ==================================================
   UPDATE BOARD FALL
================================================== */

function updateBoardFall(delta){

  for(
    let row=0;
    row<ROWS;
    row++
  ){

    for(
      let col=0;
      col<COLS;
      col++
    ){

      const b=
        board[row][col];


      if(!b)
        continue;


      if(!b.falling){

        b.y=b.targetY;

        continue;
      }


      const distance=
        b.targetY-b.y;


      if(
        Math.abs(distance)<1
      ){

        b.y=b.targetY;

        b.falling=false;

      }else{

        b.y +=
          distance*
          Math.min(
            1,
            delta/160
          );
      }
    }
  }
}


/* ==================================================
   AFTER REMOVAL
================================================== */

function processAfterRemoval(){

  /*
    消去対象を削除
  */

  for(
    let row=0;
    row<ROWS;
    row++
  ){

    for(
      let col=0;
      col<COLS;
      col++
    ){

      const b=
        board[row][col];


      if(
        b &&
        b.removing
      ){

        board[row][col]=null;
      }
    }
  }


  /*
    まず列を上へ詰める
  */

  compactColumns();


  /*
    その後、
    上とつながっていない
    バブルを落とす
  */

  const dropped=
    dropFloatingBubbles();


  if(dropped){

    /*
      浮いたバブルが落ちた後に
      連鎖をチェック
    */

    setTimeout(
      ()=>{
        if(gameState==="playing"){

          checkChain();
        }
      },
      350
    );

  }else{

    checkChain();
  }
}


/* ==================================================
   CHECK CHAIN
================================================== */

function checkChain(){

  if(gameState!=="playing")
    return;


  const visited=
    new Set();


  const groups=[];


  for(
    let row=0;
    row<ROWS;
    row++
  ){

    for(
      let col=0;
      col<COLS;
      col++
    ){

      const b=
        board[row][col];


      if(!b)
        continue;


      const key=
        row+","+col;


      if(visited.has(key))
        continue;


      const group=
        findSameColorGroup(
          row,
          col
        );


      for(const p of group){

        visited.add(
          p.row+","+p.col
        );
      }


      if(group.length>=3){

        groups.push(group);
      }
    }
  }


  if(groups.length===0){

    checkClearAndMoves();

    if(
      gameState==="playing"
    ){

      ensurePlayableBoard();
    }

    return;
  }


  /*
    見つかったグループを消す
  */

  for(const group of groups){

    removeGroup(group);
  }


  setTimeout(
    ()=>{
      if(gameState==="playing"){

        processAfterRemoval();
      }
    },
    220
  );
}


/* ==================================================
   CLEAR / GAME OVER
================================================== */

function checkClearAndMoves(){

  if(gameState!=="playing")
    return;


  let count=0;


  for(
    let row=0;
    row<ROWS;
    row++
  ){

    for(
      let col=0;
      col<COLS;
      col++
    ){

      if(board[row][col]){

        count++;
      }
    }
  }


  /*
    全消し
  */

  if(
    count===0 &&
    fallingBubbles.length===0
  ){

    gameOver(
      "CLEAR!",
      "All bubbles cleared!"
    );

    return;
  }


  /*
    舌がなくなった
  */

  if(
    moves<=0 &&
    !tongue.active &&
    fallingBubbles.length===0
  ){

    gameOver(
      "GAME OVER",
      "No tongues left!"
    );
  }
}


/* ==================================================
   GAME OVER
================================================== */

function gameOver(
  title,
  text
){

  if(gameState!=="playing")
    return;


  gameState=
    title==="CLEAR!"
    ? "clear"
    : "gameover";


  document
    .getElementById("resultTitle")
    .textContent=title;


  document
    .getElementById("resultText")
    .textContent=text;


  document
    .getElementById("resultScreen")
    .style.display="flex";


  tongue.active=false;
  tongue.group=null;
}


/* ==================================================
   ADD NEW ROW
================================================== */

function addNewRow(){

  if(gameState!=="playing")
    return;


  /*
    下端が埋まっていたら
    新しい列を入れる前に終了
  */

  for(
    let col=0;
    col<COLS;
    col++
  ){

    if(board[ROWS-1][col]){

      gameOver(
        "GAME OVER",
        "The bubbles reached the bottom!"
      );

      return;
    }
  }


  /*
    下へ1段ずつ移動
  */

  for(
    let row=ROWS-1;
    row>0;
    row--
  ){

    for(
      let col=0;
      col<COLS;
      col++
    ){

      const b=
        board[row-1][col];


      board[row][col]=b;


      if(b){

        b.row=row;
        b.col=col;

        b.falling=true;
      }
    }
  }


  /*
    新しい最上段
  */

  for(
    let col=0;
    col<COLS;
    col++
  ){

    const b=
      createBubble(
        0,
        col,
        false
      );


    b.x=
      boardLeft+
      col*cellSize+
      cellSize/2;


    b.y=
      boardTop-
      cellSize*1.2;


    b.falling=true;


    board[0][col]=b;
  }


  updatePositions();
}


/* ==================================================
   FINISH TONGUE
================================================== */

function finishTongue(){

  if(!tongue.group){

    tongue.active=false;

    return;
  }


  removeGroup(
    tongue.group
  );


  tongue.active=false;

  tongue.group=null;


  setTimeout(
    ()=>{
      if(gameState==="playing"){

        processAfterRemoval();
      }
    },
    180
  );
}


/* ==================================================
   UPDATE
================================================== */

function update(delta){

  if(gameState!=="playing")
    return;


  /*
    舌
  */

  if(tongue.active){

    tongue.progress +=
      delta/650;


    if(
      tongue.progress>=0.5 &&
      tongue.progress<0.5+
      delta/650
    ){

      finishTongue();
    }
  }


  /*
    バブル落下
  */

  updateBoardFall(delta);


  /*
    浮遊バブル落下
  */

  updateFallingBubbles(delta);


  /*
    新しい列のタイマー
  */

  dropTimer-=delta;


  if(dropTimer<=0){

    dropTimer=
      DROP_INTERVAL;

    addNewRow();
  }


  document
    .getElementById("timer")
    .textContent=
    Math.max(
      0,
      dropTimer/1000
    ).toFixed(1);


  /*
    落下が全部終わった後
  */

  if(
    !tongue.active &&
    fallingBubbles.length===0
  ){

    checkClearAndMoves();
  }
}

  );

   DRAW FALLING BUBBLES
================================================== */

function drawFallingBubbles(){

  for(
    const b of fallingBubbles
  ){

    drawBubble(b);
  }
}


/* ==================================================
   GAME LOOP
================================================== */

function loop(time){

  const delta=
    Math.min(
      50,
      Math.max(
        0,
        time-lastTime
      )
    );


  lastTime=time;


  gameCtx.clearRect(
    0,
    0,
    gameCanvas.width,
    gameCanvas.height
  );


  drawBackground();


  /*
    board
  */

  for(
    let row=0;
    row<ROWS;
    row++
  ){

    for(
      let col=0;
      col<COLS;
      col++
    ){

      drawBubble(
        board[row][col]
      );
    }
  }


  /*
    falling
  */

  drawFallingBubbles();


  /*
    chameleon
  */

  drawChameleon();


  /*
    tongue
  */

  drawTongue();


  /*
    update
  */

  update(delta);


  animationId=
    requestAnimationFrame(loop);
}


/* ==================================================
   RESIZE
================================================== */

window.addEventListener(
  "resize",
  ()=>{
    
    if(!gameCanvas)
      return;


    resizeGame();

    updatePositions();
  }
);


/* ==================================================
   INITIAL TITLE STATE
================================================== */

gameState="title";


</script>

</body>
</html>
