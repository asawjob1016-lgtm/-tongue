<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,
  initial-scale=1,
  maximum-scale=1,
  user-scalable=no"
>

<title>Chameleon's Tongue</title>

<style>

/* ==================================================
   BASIC
================================================== */

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html,
body{

  width:100%;
  height:100%;

  overflow:hidden;

  font-family:sans-serif;

  background:#eaf9ff;

  touch-action:none;
}

button{

  border:none;

  cursor:pointer;

}

/* ==================================================
   TITLE
================================================== */

#titleScreen{

  position:fixed;

  inset:0;

  display:flex;

  flex-direction:column;

  justify-content:center;

  align-items:center;

  background:
    linear-gradient(
      180deg,
      #d8f7ff,
      #ffffff
    );

  z-index:1000;

}

#gameTitle{

  font-size:42px;

  font-weight:bold;

  color:#2d8f5a;

  text-align:center;

  margin-bottom:8px;

}

#subTitle{

  font-size:22px;

  color:#666;

  margin-bottom:20px;

}

#titleCanvas{

  width:340px;

  height:240px;

  max-width:90%;

}

#startBtn,
#restartBtn{

  margin-top:20px;

  padding:16px 48px;

  font-size:26px;

  font-weight:bold;

  border-radius:20px;

  background:#37c96b;

  color:white;

  box-shadow:
    0 5px 15px rgba(0,0,0,.2);

}

#startBtn:active,
#restartBtn:active{

  transform:scale(.95);

}

/* ==================================================
   INTRO
================================================== */

#introScreen{

  position:fixed;

  inset:0;

  display:none;

  flex-direction:column;

  justify-content:center;

  align-items:center;

  background:
    linear-gradient(
      180deg,
      #d8f7ff,
      #ffffff
    );

  z-index:1500;

}

#introCanvas{

  width:360px;

  height:360px;

  max-width:90%;

}

#introText{

  min-height:60px;

  margin-top:5px;

  font-size:24px;

  font-weight:bold;

  color:#555;

  text-align:center;

}

#introNextBtn{

  margin-top:15px;

  padding:12px 35px;

  font-size:20px;

  font-weight:bold;

  border-radius:18px;

  background:#37c96b;

  color:white;

  box-shadow:
    0 4px 12px rgba(0,0,0,.15);

}

#introNextBtn:active{

  transform:scale(.95);

}

#introSkip{

  margin-top:10px;

  padding:8px 20px;

  font-size:15px;

  background:transparent;

  color:#888;

}

/* ==================================================
   GAME
================================================== */

#gameScreen{

  display:none;

  position:fixed;

  inset:0;

}

#gameCanvas{

  display:block;

  width:100%;

  height:100%;

  background:
    linear-gradient(
      180deg,
      #dff6ff,
      #ffffff
    );

}

/* ==================================================
   UI
================================================== */

#ui{

  position:absolute;

  top:10px;

  left:50%;

  transform:translateX(-50%);

  z-index:100;

  display:flex;

  align-items:center;

  gap:16px;

  padding:9px 18px;

  border-radius:20px;

  background:
    rgba(255,255,255,.92);

  box-shadow:
    0 3px 10px rgba(0,0,0,.12);

  font-size:19px;

  font-weight:bold;

  color:#333;

  white-space:nowrap;

}

#moves{

  color:#e94d4d;

}

#timer{

  color:#2d8f5a;

}

/* ==================================================
   RESULT
================================================== */

#resultScreen{

  position:absolute;

  inset:0;

  display:none;

  flex-direction:column;

  justify-content:center;

  align-items:center;

  background:
    rgba(255,255,255,.91);

  z-index:500;

}

#resultTitle{

  font-size:48px;

  font-weight:bold;

  color:#2d8f5a;

  margin-bottom:10px;

}

#resultText{

  font-size:22px;

  color:#555;

  text-align:center;

  margin-bottom:10px;

}

</style>

</head>

<body>


<!-- ==================================================
     TITLE
================================================== -->

<div id="titleScreen">

  <div id="gameTitle">
    Chameleon's Tongue
  </div>

  <div id="subTitle">
    Bubble Puzzle
  </div>

  <canvas
    id="titleCanvas"
    width="400"
    height="260">
  </canvas>

  <button id="startBtn">
    START
  </button>

</div>


<!-- ==================================================
     INTRO
================================================== -->

<div id="introScreen">

  <canvas
    id="introCanvas"
    width="400"
    height="400">
  </canvas>

  <div id="introText"></div>

  <button id="introNextBtn">
    NEXT
  </button>

  <button id="introSkip">
    SKIP
  </button>

</div>


<!-- ==================================================
     GAME
================================================== -->

<div id="gameScreen">

  <div id="ui">

    <span>
      Tongue :
      <span id="moves">30</span>
    </span>

    <span>
      Next :
      <span id="timer">4.5</span>
    </span>

  </div>

  <canvas id="gameCanvas"></canvas>

  <div id="resultScreen">

    <div id="resultTitle">
      CLEAR!
    </div>

    <div id="resultText">
      All bubbles cleared!
    </div>

    <button id="restartBtn">
      PLAY AGAIN
    </button>

  </div>

</div>


<script>

/* ==================================================
   TITLE CHAMELEON
================================================== */

const titleCanvas =
  document.getElementById("titleCanvas");

const titleCtx =
  titleCanvas.getContext("2d");


function drawTitleChameleon(){

  titleCtx.clearRect(
    0,
    0,
    titleCanvas.width,
    titleCanvas.height
  );

  titleCtx.save();

  titleCtx.translate(40,20);

  /* body */

  titleCtx.fillStyle="#9be17f";

  titleCtx.strokeStyle="#58a84a";

  titleCtx.lineWidth=6;

  titleCtx.beginPath();

  titleCtx.moveTo(50,140);

  titleCtx.quadraticCurveTo(
    120,40,
    250,80
  );

  titleCtx.quadraticCurveTo(
    320,110,
    280,160
  );

  titleCtx.quadraticCurveTo(
    180,190,
    80,170
  );

  titleCtx.closePath();

  titleCtx.fill();

  titleCtx.stroke();


  /* tail */

  titleCtx.beginPath();

  titleCtx.arc(
    40,
    150,
    35,
    0,
    Math.PI*2
  );

  titleCtx.stroke();

  titleCtx.beginPath();

  titleCtx.arc(
    40,
    150,
    18,
    0,
    Math.PI*2
  );

  titleCtx.stroke();


  /* eye */

  titleCtx.fillStyle="white";

  titleCtx.beginPath();

  titleCtx.arc(
    240,
    90,
    22,
    0,
    Math.PI*2
  );

  titleCtx.fill();

  titleCtx.strokeStyle="#333";

  titleCtx.stroke();

  titleCtx.fillStyle="#222";

  titleCtx.beginPath();

  titleCtx.arc(
    245,
    90,
    6,
    0,
    Math.PI*2
  );

  titleCtx.fill();


  /* mouth */

  titleCtx.strokeStyle="#397d3e";

  titleCtx.lineWidth=5;

  titleCtx.beginPath();

  titleCtx.arc(
    280,
    120,
    14,
    0.1,
    Math.PI-0.1
  );

  titleCtx.stroke();


  /* tongue */

  titleCtx.strokeStyle="#ff4d4d";

  titleCtx.lineWidth=9;

  titleCtx.beginPath();

  titleCtx.moveTo(
    288,
    125
  );

  titleCtx.lineTo(
    360,
    98
  );

  titleCtx.stroke();


  /* legs */

  titleCtx.strokeStyle="#58a84a";

  titleCtx.lineWidth=8;

  titleCtx.beginPath();

  titleCtx.moveTo(120,165);

  titleCtx.lineTo(110,205);

  titleCtx.moveTo(170,165);

  titleCtx.lineTo(160,205);

  titleCtx.moveTo(220,165);

  titleCtx.lineTo(210,205);

  titleCtx.moveTo(260,160);

  titleCtx.lineTo(250,200);

  titleCtx.stroke();

  titleCtx.restore();

}

drawTitleChameleon();


/* ==================================================
   INTRO
================================================== */

const introCanvas =
  document.getElementById("introCanvas");

const introCtx =
  introCanvas.getContext("2d");

const introText =
  document.getElementById("introText");

const introNextBtn =
  document.getElementById("introNextBtn");

const introSkip =
  document.getElementById("introSkip");


let introIndex=0;


const introScenes=[

  "ある いいてんきの ひ。",

  "おなかすいた。",

  "あっ！ たべもの？",

  "これは……とどくかな？",

  "びよーーーん！",

  "あれ？ とれない。",

  "3こ つながってる！",

  "これなら とれそう！"

];


/* ==================================================
   SHOW INTRO
================================================== */

function showIntro(){

  document
    .getElementById("titleScreen")
    .style.display="none";

  document
    .getElementById("gameScreen")
    .style.display="none";

  document
    .getElementById("introScreen")
    .style.display="flex";

  introIndex=0;

  showIntroScene();

}


/* ==================================================
   SHOW INTRO SCENE
================================================== */

function showIntroScene(){

  introText.textContent=
    introScenes[introIndex];

  drawIntro();

  if(
    introIndex===
    introScenes.length-1
  ){

    introNextBtn.textContent=
      "LET'S EAT!";

  }else{

    introNextBtn.textContent=
      "NEXT";

  }

}


/* ==================================================
   INTRO NEXT
================================================== */

introNextBtn.addEventListener(
  "click",
  ()=>{

    introIndex++;

    if(
      introIndex>=
      introScenes.length
    ){

      document
        .getElementById("introScreen")
        .style.display="none";

      startGame();

      return;

    }

    showIntroScene();

  }
);


/* ==================================================
   INTRO SKIP
================================================== */

introSkip.addEventListener(
  "click",
  ()=>{

    document
      .getElementById("introScreen")
      .style.display="none";

    startGame();

  }
);


/* ==================================================
   DRAW INTRO
================================================== */

function drawIntro(){

  introCtx.clearRect(
    0,
    0,
    introCanvas.width,
    introCanvas.height
  );


  const gradient=
    introCtx.createLinearGradient(
      0,
      0,
      0,
      introCanvas.height
    );

  gradient.addColorStop(
    0,
    "#d8f7ff"
  );

  gradient.addColorStop(
    1,
    "#ffffff"
  );

  introCtx.fillStyle=
    gradient;

  introCtx.fillRect(
    0,
    0,
    introCanvas.width,
    introCanvas.height
  );


  drawIntroCloud(
    70,
    65,
    1
  );

  drawIntroCloud(
    320,
    120,
    .7
  );


  introCtx.fillStyle=
    "#a7e88f";

  introCtx.fillRect(
    0,
    330,
    400,
    70
  );


  drawIntroChameleon();


  if(introIndex>=2){

    drawIntroBubbles();

  }

}


/* ==================================================
   INTRO CHAMELEON
================================================== */

function drawIntroChameleon(){

  const x=105;

  const y=275;


  /* tail */

  introCtx.strokeStyle=
    "#58a84a";

  introCtx.lineWidth=7;

  introCtx.beginPath();

  introCtx.arc(
    x-55,
    y,
    30,
    0,
    Math.PI*1.7
  );

  introCtx.stroke();


  /* body */

  introCtx.fillStyle=
    "#8fdc77";

  introCtx.strokeStyle=
    "#58a84a";

  introCtx.lineWidth=5;

  introCtx.beginPath();

  introCtx.ellipse(
    x,
    y,
    65,
    40,
    0,
    0,
    Math.PI*2
  );

  introCtx.fill();

  introCtx.stroke();


  /* head */

  introCtx.beginPath();

  introCtx.arc(
    x+55,
    y-30,
    27,
    0,
    Math.PI*2
  );

  introCtx.fill();

  introCtx.stroke();


  /* eye */

  introCtx.fillStyle=
    "white";

  introCtx.beginPath();

  introCtx.arc(
    x+65,
    y-39,
    15,
    0,
    Math.PI*2
  );

  introCtx.fill();

  introCtx.strokeStyle=
    "#333";

  introCtx.stroke();

  introCtx.fillStyle=
    "#222";

  introCtx.beginPath();

  introCtx.arc(
    x+68,
    y-39,
    5,
    0,
    Math.PI*2
  );

  introCtx.fill();


  /* mouth */

  introCtx.strokeStyle=
    "#397d3e";

  introCtx.lineWidth=4;

  introCtx.beginPath();

  introCtx.arc(
    x+68,
    y-15,
    14,
    0.1,
    Math.PI-0.1
  );

  introCtx.stroke();


  /* legs */

  introCtx.strokeStyle=
    "#58a84a";

  introCtx.lineWidth=6;

  introCtx.beginPath();

  introCtx.moveTo(
    x-30,
    y+27
  );

  introCtx.lineTo(
    x-40,
    y+55
  );

  introCtx.moveTo(
    x+15,
    y+28
  );

  introCtx.lineTo(
    x+10,
    y+55
  );

  introCtx.stroke();


  /* tongue */

  if(introIndex>=4){

    introCtx.strokeStyle=
      "#ff5555";

    introCtx.lineWidth=8;

    introCtx.lineCap="round";

    introCtx.beginPath();

    introCtx.moveTo(
      x+68,
      y-15
    );

    introCtx.lineTo(
      330,
      190
    );

    introCtx.stroke();

  }

}


/* ==================================================
   INTRO BUBBLES
================================================== */

function drawIntroBubbles(){

  drawIntroBubble(
    300,
    145,
    "#ff5a5a"
  );

  drawIntroBubble(
    340,
    145,
    "#4dabff"
  );

  drawIntroBubble(
    320,
    185,
    "#ffd43b"
  );


  if(introIndex>=6){

    drawIntroBubble(
      285,
      185,
      "#ffd43b"
    );

    drawIntroBubble(
      355,
      185,
      "#ffd43b"
    );

  }

}


/* ==================================================
   INTRO BUBBLE
================================================== */

function drawIntroBubble(
  x,
  y,
  color
){

  introCtx.beginPath();

  introCtx.fillStyle=
    color;

  introCtx.arc(
    x,
    y,
    22,
    0,
    Math.PI*2
  );

  introCtx.fill();

  introCtx.strokeStyle=
    "white";

  introCtx.lineWidth=3;

  introCtx.stroke();


  introCtx.beginPath();

  introCtx.fillStyle=
    "rgba(255,255,255,.65)";

  introCtx.arc(
    x-7,
    y-8,
    5,
    0,
    Math.PI*2
  );

  introCtx.fill();

}


/* ==================================================
   INTRO CLOUD
================================================== */

function drawIntroCloud(
  x,
  y,
  scale
){

  introCtx.save();

  introCtx.translate(
    x,
    y
  );

  introCtx.scale(
    scale,
    scale
  );

  introCtx.fillStyle=
    "rgba(255,255,255,.8)";

  introCtx.beginPath();

  introCtx.arc(
    0,
    10,
    25,
    0,
    Math.PI*2
  );

  introCtx.arc(
    30,
    0,
    32,
    0,
    Math.PI*2
  );

  introCtx.arc(
    65,
    12,
    25,
    0,
    Math.PI*2
  );

  introCtx.fill();

  introCtx.restore();

}


/* ==================================================
   GAME SETTINGS
================================================== */

const COLS=7;

const ROWS=10;

const INITIAL_ROWS=5;

const DROP_INTERVAL=4500;

const MAX_MOVES=30;


/*
  現在の雰囲気を維持して4色
*/

const COLORS=[

  "#ff5a5a",

  "#4dabff",

  "#ffd43b",

  "#69db7c"

];


let gameCanvas=null;

let gameCtx=null;

let board=[];

let cellSize=50;

let boardLeft=0;

let boardTop=72;

let moves=MAX_MOVES;

let gameState="title";

let dropTimer=DROP_INTERVAL;

let lastTime=0;

let animationId=null;

let fallingBubbles=[];


/* ==================================================
   TONGUE
================================================== */

let tongue={

  active:false,

  progress:0,

  startX:0,

  startY:0,

  targetX:0,

  targetY:0,

  group:null

};


/* ==================================================
   START / RESTART
================================================== */

document
  .getElementById("startBtn")
  .addEventListener(
    "click",
    showIntro
  );


document
  .getElementById("restartBtn")
  .addEventListener(
    "click",
    startGame
  );


function startGame(){

  document
    .getElementById("titleScreen")
    .style.display="none";

  document
    .getElementById("introScreen")
    .style.display="none";

  document
    .getElementById("gameScreen")
    .style.display="block";

  document
    .getElementById("resultScreen")
    .style.display="none";


  gameCanvas=
    document.getElementById("gameCanvas");

  gameCtx=
    gameCanvas.getContext("2d");


  moves=MAX_MOVES;

  gameState="playing";

  dropTimer=DROP_INTERVAL;

  fallingBubbles=[];

  tongue.active=false;

  tongue.group=null;

  lastTime=
    performance.now();


  document
    .getElementById("moves")
    .textContent=
    moves;


  document
    .getElementById("timer")
    .textContent=
    (DROP_INTERVAL/1000).toFixed(1);


  resizeGame();

  createBoard();


  gameCanvas.onpointerdown=
    tapBubble;


  if(animationId){

    cancelAnimationFrame(
      animationId
    );

  }


  animationId=
    requestAnimationFrame(loop);

}


/* ==================================================
   RESIZE
================================================== */

function resizeGame(){

  if(!gameCanvas)
    return;


  gameCanvas.width=
    window.innerWidth;

  gameCanvas.height=
    window.innerHeight;


  cellSize=
    Math.min(
      54,
      (gameCanvas.width-20)/COLS
    );


  boardLeft=
    (
      gameCanvas.width-
      cellSize*COLS
    )/2;


  boardTop=72;


  updatePositions();

}


/* ==================================================
   CREATE BOARD
================================================== */

function createBoard(){

  board=[];


  for(
    let row=0;
    row<ROWS;
    row++
  ){

    board[row]=[];


    for(
      let col=0;
      col<COLS;
      col++
    ){

      if(row<INITIAL_ROWS){

        board[row][col]=
          createBubble(
            row,
            col,
            true
          );

      }else{

        board[row][col]=null;

      }

    }

  }


  updatePositions();


  for(
    let row=0;
    row<ROWS;
    row++
  ){

    for(
      let col=0;
      col<COLS;
      col++
    ){

      const b=
        board[row][col];

      if(!b)
        continue;

      b.y=b.targetY;

      b.falling=false;

    }

  }


  /*
    初期盤面が完全な運任せで
    デッドロックにならないようにする。
  */

  ensurePlayableBoard();

}


/* ==================================================
   CREATE BUBBLE
================================================== */

function createBubble(
  row,
  col,
  visible
){

  return{

    row:row,

    col:col,

    color:randomColor(),

    x:0,

    y:
      visible
      ? 0
      : boardTop-cellSize,

    targetY:0,

    scale:1,

    falling:false,

    removing:false,

    fallVelocity:0,

    detached:false

  };

}


/* ==================================================
   RANDOM COLOR
================================================== */

function randomColor(){

  return COLORS[
    Math.floor(
      Math.random()*COLORS.length
    )
  ];

}


/* ==================================================
   UPDATE POSITIONS
================================================== */

function updatePositions(){

  if(!board)
    return;


  for(
    let row=0;
    row<ROWS;
    row++
  ){

    for(
      let col=0;
      col<COLS;
      col++
    ){

      const b=
        board[row][col];

      if(!b)
        continue;


      b.row=row;

      b.col=col;


      b.x=
        boardLeft+
        col*cellSize+
        cellSize/2;


      b.targetY=
        boardTop+
        row*cellSize+
        cellSize/2;


      if(
        !b.falling &&
        !b.removing
      ){

        b.y=
          b.targetY;

      }

    }

  }

}


/* ==================================================
   DRAW BUBBLE
================================================== */

function drawBubble(b){

  if(!b)
    return;

  if(b.scale<=0)
    return;


  gameCtx.save();


  gameCtx.translate(
    b.x,
    b.y
  );


  gameCtx.scale(
    b.scale,
    b.scale
  );


  const radius=
    cellSize*.41;


  /* shadow */

  gameCtx.beginPath();

  gameCtx.fillStyle=
    "rgba(0,0,0,.12)";

  gameCtx.arc(
    3,
    4,
    radius,
    0,
    Math.PI*2
  );

  gameCtx.fill();


  /* bubble */

  gameCtx.beginPath();

  gameCtx.fillStyle=
    b.color;

  gameCtx.arc(
    0,
    0,
    radius,
    0,
    Math.PI*2
  );

  gameCtx.fill();


  /* border */

  gameCtx.strokeStyle=
    "rgba(255,255,255,.9)";

  gameCtx.lineWidth=3;

  gameCtx.stroke();


  /* shine */

  gameCtx.beginPath();

  gameCtx.fillStyle=
    "rgba(255,255,255,.65)";

  gameCtx.arc(
    -radius*.32,
    -radius*.38,
    radius*.18,
    0,
    Math.PI*2
  );

  gameCtx.fill();


  gameCtx.restore();

}


/* ==================================================
   CHAMELEON MOUTH
================================================== */

function getChameleonMouth(){

  const x=82;

  const y=
    gameCanvas.height-72;


  return{

    x:x+62,

    y:y-14

  };

}


/* ==================================================
   CHAMELEON
================================================== */

function drawChameleon(){

  const x=82;

  const y=
    gameCanvas.height-72;


  /* tail */

  gameCtx.strokeStyle=
    "#58a84a";

  gameCtx.lineWidth=7;

  gameCtx.beginPath();

  gameCtx.arc(
    x-45,
    y,
    30,
    0,
    Math.PI*1.7
  );

  gameCtx.stroke();

/* ==================================================
   TONGUE
================================================== */

function drawTongue(){

  if(!tongue.active)
    return;


  let p=
    tongue.progress;


  let reach;


  if(p<.5){

    reach=p/.5;

  }else{

    reach=1;

  }


  const x=
    tongue.startX+
    (
      tongue.targetX-
      tongue.startX
    )*reach;


  const y=
    tongue.startY+
    (
      tongue.targetY-
      tongue.startY
    )*reach;


  gameCtx.save();


  gameCtx.strokeStyle=
    "#ff5555";

  gameCtx.lineWidth=8;

  gameCtx.lineCap="round";


  gameCtx.beginPath();

  gameCtx.moveTo(
    tongue.startX,
    tongue.startY
  );

  gameCtx.lineTo(
    x,
    y
  );

  gameCtx.stroke();


  gameCtx.fillStyle=
    "#ff7777";

  gameCtx.beginPath();

  gameCtx.arc(
    x,
    y,
    7,
    0,
    Math.PI*2
  );

  gameCtx.fill();


  gameCtx.restore();

}


/* ==================================================
   TAP
================================================== */

function tapBubble(e){

  if(gameState!=="playing")
    return;

  if(tongue.active)
    return;

  if(moves<=0)
    return;


  const rect=
    gameCanvas.getBoundingClientRect();


  const mx=
    e.clientX-rect.left;

  const my=
    e.clientY-rect.top;


  const col=
    Math.floor(
      (mx-boardLeft)/
      cellSize
    );


  const row=
    Math.floor(
      (my-boardTop)/
      cellSize
    );


  if(
    row<0 ||
    row>=ROWS ||
    col<0 ||
    col>=COLS
  ){

    return;

  }


  const bubble=
    board[row][col];


  if(!bubble)
    return;


  const group=
    findSameColorGroup(
      row,
      col
    );


  if(group.length<3){

    return;

  }


  moves--;


  document
    .getElementById("moves")
    .textContent=
    moves;


  const mouth=
    getChameleonMouth();


  tongue.startX=
    mouth.x;

  tongue.startY=
    mouth.y;

  tongue.targetX=
    bubble.x;

  tongue.targetY=
    bubble.y;

  tongue.group=
    group;

  tongue.progress=0;

  tongue.active=true;

}


/* ==================================================
   FIND SAME COLOR GROUP
================================================== */

function findSameColorGroup(
  startRow,
  startCol
){

  const start=
    board[startRow][startCol];


  if(!start)
    return [];


  const color=
    start.color;


  const result=[];

  const visited=
    new Set();


  const queue=[
    [startRow,startCol]
  ];


  while(queue.length){

    const [
      row,
      col
    ]=
      queue.shift();


    if(
      row<0 ||
      row>=ROWS ||
      col<0 ||
      col>=COLS
    ){

      continue;

    }


    const key=
      row+","+col;


    if(visited.has(key))
      continue;


    visited.add(key);


    const b=
      board[row][col];


    if(!b)
      continue;


    if(b.color!==color)
      continue;


    result.push({
      row:row,
      col:col
    });


    queue.push([
      row-1,
      col
    ]);

    queue.push([
      row+1,
      col
    ]);

    queue.push([
      row,
      col-1
    ]);

    queue.push([
      row,
      col+1
    ]);

  }


  return result;

}


/* ==================================================
   REMOVE GROUP
================================================== */

function removeGroup(group){

  for(const pos of group){

    const b=
      board[pos.row][pos.col];

    if(b){

      b.removing=true;

      b.scale=1;

    }

  }

}


/* ==================================================
   HAS PLAYABLE GROUP
================================================== */

function hasPlayableGroup(){

  const visited=
    new Set();


  for(
    let row=0;
    row<ROWS;
    row++
  ){

    for(
      let col=0;
      col<COLS;
      col++
    ){

      const b=
        board[row][col];

      if(!b)
        continue;


      const key=
        row+","+col;


      if(visited.has(key))
        continue;


      const group=
        findSameColorGroup(
          row,
          col
        );


      for(const p of group){

        visited.add(
          p.row+","+p.col
        );

      }


      if(group.length>=3){

        return true;

      }

    }

  }


  return false;

}


/* ==================================================
   FIND SIMPLE TRIPLE
================================================== */

function findTriplePositions(){

  /*
    横3個
  */

  for(
    let row=0;
    row<ROWS;
    row++
  ){

    for(
      let col=0;
      col<COLS-2;
      col++
    ){

      if(
        board[row][col] &&
        board[row][col+1] &&
        board[row][col+2]
      ){

        return [

          {
            row:row,
            col:col
          },

          {
            row:row,
            col:col+1
          },

          {
            row:row,
            col:col+2
          }

        ];

      }

    }

  }


  /*
    縦3個
  */

  for(
    let row=0;
    row<ROWS-2;
    row++
  ){

    for(
      let col=0;
      col<COLS;
      col++
    ){

      if(
        board[row][col] &&
        board[row+1][col] &&
        board[row+2][col]
      ){

        return [

          {
            row:row,
            col:col
          },

          {
            row:row+1,
            col:col
          },

          {
            row:row+2,
            col:col
          }

        ];

      }

    }

  }


  return null;

}


/* ==================================================
   RESCUE DEADLOCK
================================================== */

function ensurePlayableBoard(){

  if(gameState!=="playing")
    return;


  /*
    すでに消せるなら触らない。
  */

  if(hasPlayableGroup())
    return;


  /*
    まず既存の3連続位置があれば、
    色だけ合わせる。

    これなら盤面全体を
    シャッフルしないので、
    見た目が大きく変わらない。
  */

  const triple=
    findTriplePositions();


  if(triple){

    const color=
      triple.length>0 &&
      board[
        triple[0].row
      ][
        triple[0].col
      ].color;


    for(const p of triple){

      board[p.row][p.col].color=
        color;

    }


    return;

  }


  /*
    盤面に3個以上あれば、
    最初のバブルから近い空き場所へ
    最小限だけ移動して3個を作る。
  */

  const occupied=[];

  const empty=[];


  for(
    let row=0;
    row<ROWS;
    row++
  ){

    for(
      let col=0;
      col<COLS;
      col++
    ){

      if(board[row][col]){

        occupied.push({
          row:row,
          col:col
        });

      }else{

        empty.push({
          row:row,
          col:col
        });

      }

    }

  }


  if(occupied.length<3)
    return;


  /*
    近くの3マスが空いている場所を探す。
  */

  for(
    let row=0;
    row<ROWS;
    row++
  ){

    for(
      let col=0;
      col<COLS-2;
      col++
    ){

      const positions=[

        {
          row:row,
          col:col
        },

        {
          row:row,
          col:col+1
        },

        {
          row:row,
          col:col+2
        }

      ];


      const available=
        positions.filter(
          p=>!board[p.row][p.col]
        );


      if(available.length>=2){

        const source1=
          occupied[0];

        const source2=
          occupied[1];

        const source3=
          occupied[2];


        const bubbles=[

          board[
            source1.row
          ][
            source1.col
          ],

          board[
            source2.row
          ][
            source2.col
          ],

          board[
            source3.row
          ][
            source3.col
          ]

        ];


        /*
          元位置を空ける。
        */

        for(const s of [
          source1,
          source2,
          source3
        ]){

          board[
            s.row
          ][
            s.col
          ]=null;

        }


        /*
          3マスへ配置。
        */

        for(
          let i=0;
          i<3;
          i++
        ){

          const p=
            positions[i];

          const b=
            bubbles[i];


          b.row=p.row;

          b.col=p.col;

          b.color=COLORS[0];

          b.falling=false;

          b.removing=false;

          b.detached=false;

          board[
            p.row
          ][
            p.col
          ]=b;

        }


        updatePositions();

        return;

      }

    }

  }


  /*
    横が無理なら縦。
  */

  for(
    let row=0;
    row<ROWS-2;
    row++
  ){

    for(
      let col=0;
      col<COLS;
      col++
    ){

      const positions=[

        {
          row:row,
          col:col
        },

        {
          row:row+1,
          col:col
        },

        {
          row:row+2,
          col:col
        }

      ];


      const available=
        positions.filter(
          p=>!board[p.row][p.col]
        );


      if(available.length>=2){

        const bubbles=[

          board[
            occupied[0].row
          ][
            occupied[0].col
          ],

          board[
            occupied[1].row
          ][
            occupied[1].col
          ],

          board[
            occupied[2].row
          ][
            occupied[2].col
          ]

        ];


        for(
          let i=0;
          i<3;
          i++
        ){

          board[
            occupied[i].row
          ][
            occupied[i].col
          ]=null;

        }


        for(
          let i=0;
          i<3;
          i++
        ){

          const p=
            positions[i];

          const b=
            bubbles[i];


          b.row=p.row;

          b.col=p.col;

          b.color=COLORS[0];

          b.falling=false;

          b.removing=false;

          b.detached=false;


          board[
            p.row
          ][
            p.col
          ]=b;

        }


        updatePositions();

        return;

      }

    }

  }

}


/* ==================================================
   FIND TOP CONNECTED
================================================== */

function findTopConnected(){

  const connected=
    new Set();

  const queue=[];


  /*
    最上段を支柱にする。
  */

  for(
    let col=0;
    col<COLS;
    col++
  ){

    if(board[0][col]){

      queue.push([
        0,
        col
      ]);

    }

  }


  while(queue.length){

    const [
      row,
      col
    ]=
      queue.shift();


    if(
      row<0 ||
      row>=ROWS ||
      col<0 ||
      col>=COLS
    ){

      continue;

    }


    const key=
      row+","+col;


    if(connected.has(key))
      continue;


    if(!board[row][col])
      continue;


    connected.add(key);


    queue.push([
      row-1,
      col
    ]);

    queue.push([
      row+1,
      col
    ]);

    queue.push([
      row,
      col-1
    ]);

    queue.push([
      row,
      col+1
    ]);

  }


  return connected;

}


/* ==================================================
   FIND FLOATING
================================================== */

function findFloating(){

  const connected=
    findTopConnected();

  const floating=[];


  for(
    let row=0;
    row<ROWS;
    row++
  ){

    for(
      let col=0;
      col<COLS;
      col++
    ){

      const b=
        board[row][col];

      if(!b)
        continue;


      const key=
        row+","+col;


      if(!connected.has(key)){

        floating.push({
          row:row,
          col:col
        });

      }

    }

  }


  return floating;

}


/* ==================================================
   DROP FLOATING
================================================== */

function dropFloatingBubbles(){

  const floating=
    findFloating();


  if(floating.length===0){

    return false;

  }


  for(const pos of floating){

    const b=
      board[pos.row][pos.col];


    if(!b)
      continue;


    b.detached=true;

    b.falling=true;

    b.fallVelocity=0;


    fallingBubbles.push(b);


    board[pos.row][pos.col]=null;

  }


  return true;

}


/* ==================================================
   AFTER REMOVE
================================================== */

function processAfterRemoval(){

  /*
    消去対象を盤面から削除
  */

  for(
    let row=0;
    row<ROWS;
    row++
  ){

    for(
      let col=0;
      col<COLS;
      col++
    ){

      const b=
        board[row][col];


      if(
        b &&
        b.removing
      ){

        board[row][col]=null;

      }

    }

  }


  updatePositions();


  /*
    浮いたバブルを落とす
  */

  const dropped=
    dropFloatingBubbles();


  if(dropped){

    /*
      落下が終わってから
      連鎖を確認する。
    */

    setTimeout(
      ()=>{
        if(gameState==="playing"){

          checkChain();

        }
      },
      350
    );


  }else{

    checkChain();

  }

}


/* ==================================================
   CHECK CHAIN
================================================== */

function checkChain(){

  if(gameState!=="playing")
    return;


  const visited=
    new Set();


  const groups=[];


  for(
    let row=0;
    row<ROWS;
    row++
  ){

    for(
      let col=0;
      col<COLS;
      col++
    ){

      const b=
        board[row][col];


      if(!b)
        continue;


      const key=
        row+","+col;


      if(visited.has(key))
        continue;


      const group=
        findSameColorGroup(
          row,
          col
        );


      for(const p of group){

        visited.add(
          p.row+","+p.col
        );

      }


      if(group.length>=3){

        groups.push(group);

      }

    }

  }


  if(groups.length===0){

    checkClearAndMoves();

    return;

  }


  for(const group of groups){

    removeGroup(group);

  }


  setTimeout(
    ()=>{
      if(gameState==="playing"){

        processAfterRemoval();

      }
    },
    220
  );

}


/* ==================================================
   CLEAR / GAME OVER
================================================== */

function checkClearAndMoves(){

  if(gameState!=="playing")
    return;


  let count=0;


  for(
    let row=0;
    row<ROWS;
    row++
  ){

    for(
      let col=0;
      col<COLS;
      col++
    ){

      if(board[row][col]){

        count++;

      }

    }

  }


  /*
    全消し
  */

  if(count===0){

    gameOver(
      "CLEAR!",
      "All bubbles cleared!"
    );

    return;

  }


  /*
    舌がなくなった
  */

  if(
    moves<=0 &&
    !tongue.active &&
    fallingBubbles.length===0
  ){

    gameOver(
      "GAME OVER",
      "No tongues left!"
    );

  }

}


/* ==================================================
   ADD NEW ROW
================================================== */

function addNewRow(){

  if(gameState!=="playing")
    return;


  /*
    最下段が埋まっていたら終了。
  */

  for(
    let col=0;
    col<COLS;
    col++
  ){

    if(board[ROWS-1][col]){

      gameOver(
        "GAME OVER",
        "The bubbles reached the bottom!"
      );

      return;

    }

  }


  /*
    上から下へ1段ずつ移動。
  */

  for(
    let row=ROWS-1;
    row>0;
    row--
  ){

    for(
      let col=0;
      col<COLS;
      col++
    ){

      const b=
        board[row-1][col];


      board[row][col]=b;


      if(b){

        b.row=row;

        b.col=col;

        b.falling=true;

      }

    }

  }


  /*
    新しい最上段。
  */

  for(
    let col=0;
    col<COLS;
    col++
  ){

    const b=
      createBubble(
        0,
        col,
        false
      );


    b.x=
      boardLeft+
      col*cellSize+
      cellSize/2;


    b.y=
      boardTop-
      cellSize*1.2;


    b.falling=true;


    board[0][col]=b;

  }


  updatePositions();


  /*
    新しい段ができた直後に
    デッドロックになっていたら
    最小限の救済を行う。
  */

}


/* ==================================================
   UPDATE FALLING BUBBLES
================================================== */

function updateFallingBubbles(delta){

  for(
    let i=fallingBubbles.length-1;
    i>=0;
    i--
  ){

    const b=
      fallingBubbles[i];


    b.fallVelocity+=
      0.0012*delta;


    b.y+=
      b.fallVelocity*delta;


    if(
      b.y>
      gameCanvas.height+
      cellSize
    ){

      fallingBubbles.splice(
        i,
        1
      );

    }

  }

}


/* ==================================================
   UPDATE BOARD FALL
================================================== */

function updateBoardFall(delta){

  for(
    let row=0;
    row<ROWS;
    row++
  ){

    for(
      let col=0;
      col<COLS;
      col++
    ){

      const b=
        board[row][col];


      if(!b)
        continue;


      if(!b.falling){

        b.y=
          b.targetY;

        continue;

      }


      const distance=
        b.targetY-b.y;


      if(
        Math.abs(distance)<1
      ){

        b.y=
          b.targetY;

        b.falling=false;

      }else{

        b.y+=
          distance*
          Math.min(
            1,
            delta/160
          );

      }

    }

  }

}


/* ==================================================
   TONGUE FINISH
================================================== */

function finishTongue(){

  if(!tongue.group){

    tongue.active=false;

    return;

  }


  removeGroup(
    tongue.group
  );


  tongue.active=false;

  tongue.group=null;


  setTimeout(
    ()=>{
      if(gameState==="playing"){

        processAfterRemoval();

      }
    },
    180
  );

}


/* ==================================================
   GAME UPDATE
================================================== */

function update(delta){

  if(gameState!=="playing")
    return;


  /*
    舌
  */

  if(tongue.active){

    tongue.progress+=
      delta/650;


    if(
      tongue.progress>=.5
    ){

      finishTongue();

    }

  }


  /*
    バブル落下
  */

  updateBoardFall(delta);


  updateFallingBubbles(delta);


  /*
    新しい列タイマー
  */

  dropTimer-=delta;


  if(dropTimer<=0){

    dropTimer=
      DROP_INTERVAL;


    addNewRow();

  }


  document
    .getElementById("timer")
    .textContent=
    Math.max(
      0,
      dropTimer/1000
    ).toFixed(1);


  /*
    バブルが完全に落ち着いたら
    盤面を確認。
  */

  if(
    !tongue.active &&
    fallingBubbles.length===0
  ){

    let bottomFull=true;


    for(
      let col=0;
      col<COLS;
      col++
    ){

      if(!board[ROWS-1][col]){

        bottomFull=false;

        break;

      }

    }


    if(bottomFull){

      gameOver(
        "GAME OVER",
        "The bubbles reached the bottom!"
      );

      return;

    }


    /*
      消せるグループがない場合だけ
      救済処理をする。
    */

    if(!hasPlayableGroup()){

      ensurePlayableBoard();

    }


    checkClearAndMoves();

  }

}

/* ==================================================
   CLOUD
================================================== */

function drawCloud(
  x,
  y,
  scale
){

  gameCtx.save();


  gameCtx.translate(
    x,
    y
  );


  gameCtx.scale(
    scale,
    scale
  );


  gameCtx.fillStyle=
    "rgba(255,255,255,.8)";


  gameCtx.beginPath();


  gameCtx.arc(
    0,
    10,
    25,
    0,
    Math.PI*2
  );


  gameCtx.arc(
    30,
    0,
    32,
    0,
    Math.PI*2
  );


  gameCtx.arc(
    65,
    12,
    25,
    0,
    Math.PI*2
  );


  gameCtx.fill();


  gameCtx.restore();

}


/* ==================================================
   DRAW FALLING
================================================== */

function drawFallingBubbles(){

  for(
    const b of fallingBubbles
  ){

    drawBubble(b);

  }

}


/* ==================================================
   GAME OVER / CLEAR
================================================== */

function gameOver(
  title,
  message
){

  if(gameState==="gameover")
    return;


  gameState="gameover";


  tongue.active=false;

  tongue.group=null;


  document
    .getElementById("resultTitle")
    .textContent=
    title;


  document
    .getElementById("resultText")
    .textContent=
    message;


  document
    .getElementById("resultScreen")
    .style.display="flex";

}


/* ==================================================
   GAME LOOP
================================================== */

function loop(time){

  if(!gameCtx)
    return;


  const delta=
    Math.min(
      50,
      time-lastTime
    );


  lastTime=time;


  gameCtx.clearRect(
    0,
    0,
    gameCanvas.width,
    gameCanvas.height
  );


  drawBackground();


  /*
    ボード
  */

  for(
    let row=0;
    row<ROWS;
    row++
  ){

    for(
      let col=0;
      col<COLS;
      col++
    ){

      drawBubble(
        board[row][col]
      );

    }

  }


  /*
    浮遊バブル
  */

  drawFallingBubbles();


  /*
    カメレオン
  */

  drawChameleon();


  /*
    舌
  */

  drawTongue();


  /*
    更新
  */

  update(delta);


  animationId=
    requestAnimationFrame(loop);

}


/* ==================================================
   RESIZE
================================================== */

window.addEventListener(
  "resize",
  ()=>{

    if(!gameCanvas)
      return;


    resizeGame();

  }
);

</script>
