<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">

<title>Chameleon's Tongue</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
overflow:hidden;
background:#dff6ff;
font-family:sans-serif;
touch-action:none;
}

canvas{
display:block;
background:linear-gradient(
to bottom,
#dff6ff,
#ffffff
);
}

#titleScreen{
position:absolute;
left:0;
top:0;
width:100%;
height:100%;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
background:white;
z-index:10;
}

#gameTitle{
font-size:48px;
font-weight:bold;
color:#2d8f2d;
margin-bottom:30px;
text-align:center;
}

#startBtn{
padding:18px 40px;
font-size:28px;
border:none;
border-radius:20px;
background:#32cd32;
color:white;
}

#ui{
position:absolute;
top:10px;
left:10px;
font-size:22px;
font-weight:bold;
display:none;
}

</style>
</head>
<body>

<div id="titleScreen">

<div id="gameTitle">
Chameleon's Tongue
</div>

<canvas
id="titleCanvas"
width="350"
height="250">
</canvas>

<br>

<button id="startBtn">
START
</button>

</div>

<div id="ui">
Tongue : <span id="moves">30</span>
</div>

<canvas id="gameCanvas"></canvas>

<script>

const canvas =
document.getElementById("gameCanvas");

const ctx =
canvas.getContext("2d");

function resize(){

canvas.width =
window.innerWidth;

canvas.height =
window.innerHeight;

}

resize();

window.addEventListener(
"resize",
resize
);

const titleCanvas =
document.getElementById("titleCanvas");

const tctx =
titleCanvas.getContext("2d");

function drawTitleChameleon(){

tctx.clearRect(
0,
0,
titleCanvas.width,
titleCanvas.height
);

tctx.save();

tctx.translate(40,30);

tctx.strokeStyle="#4caf50";
tctx.fillStyle="#8bcf73";
tctx.lineWidth=8;

tctx.beginPath();

tctx.moveTo(40,130);

tctx.quadraticCurveTo(
120,
40,
240,
90
);

tctx.quadraticCurveTo(
260,
130,
180,
170
);

tctx.quadraticCurveTo(
90,
190,
40,
130
);

tctx.fill();
tctx.stroke();

tctx.beginPath();

tctx.arc(
30,
150,
35,
0,
Math.PI*2
);

tctx.stroke();

tctx.beginPath();

tctx.arc(
30,
150,
15,
0,
Math.PI*2
);

tctx.stroke();

tctx.beginPath();

tctx.moveTo(
210,
90
);

tctx.lineTo(
290,
70
);

tctx.lineTo(
260,
120
);

tctx.closePath();

tctx.fill();
tctx.stroke();

tctx.fillStyle="white";

tctx.beginPath();

tctx.arc(
180,
80,
25,
0,
Math.PI*2
);

tctx.fill();

tctx.strokeStyle="black";
tctx.lineWidth=3;
tctx.stroke();

tctx.fillStyle="black";

tctx.beginPath();

tctx.arc(
180,
80,
6,
0,
Math.PI*2
);

tctx.fill();

tctx.strokeStyle="#4caf50";
tctx.lineWidth=8;

for(let i=0;i<4;i++){

let x=
90+(i*35);

tctx.beginPath();

tctx.moveTo(
x,
150
);

tctx.lineTo(
x,
190
);

tctx.stroke();

tctx.beginPath();

tctx.moveTo(
x,
190
);

tctx.lineTo(
x+20,
190
);

tctx.stroke();

}

tctx.strokeStyle="red";
tctx.lineWidth=10;

tctx.beginPath();

tctx.moveTo(
255,
105
);

tctx.lineTo(
320,
85
);

tctx.stroke();

tctx.restore();

}

drawTitleChameleon();

let gameStarted=false;

document
.getElementById("startBtn")
.addEventListener(
"click",
startGame
);

function startGame(){

document
.getElementById("titleScreen")
.style.display="none";

document
.getElementById("ui")
.style.display="block";

gameStarted=true;

}
