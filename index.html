<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0,user-scalable=no">

<title>
カメレオンバブル
</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
-webkit-tap-highlight-color:transparent;
}

html,
body{
width:100%;
height:100%;
overflow:hidden;
background:#182330;
font-family:sans-serif;
}

#game{
position:relative;
width:100vw;
height:100vh;
overflow:hidden;
}

canvas{
position:absolute;
inset:0;
width:100%;
height:100%;
}

#startButton{

position:absolute;

left:50%;
top:50%;

transform:
translate(-50%,-50%);

width:220px;
height:80px;

border:none;

border-radius:20px;

background:#36d26f;

color:white;

font-size:30px;
font-weight:bold;

z-index:100;
}

#shuffleButton{

position:absolute;

right:20px;
bottom:20px;

width:70px;
height:70px;

border:none;

border-radius:50%;

font-size:32px;

background:white;

z-index:100;
display:none;
}

#message{

position:absolute;

top:40%;
left:50%;

transform:
translate(-50%,-50%);

color:white;

font-size:42px;
font-weight:bold;

display:none;

z-index:200;
}

#topInfo{

position:absolute;

top:10px;
left:10px;

color:white;

font-size:18px;

font-weight:bold;

z-index:100;
}

</style>

</head>

<body>

<div id="game">

<canvas id="canvas"></canvas>

<div id="topInfo">

<div>
STAGE :
<span id="stage">
1
</span>
</div>

<div>
SCORE :
<span id="score">
0
</span>
</div>

<div>
舌 :
<span id="moves">
30
</span>
</div>

<div>
♻ :
<span id="shuffle">
3
</span>
</div>

</div>

<div id="message"></div>

<button id="startButton">
START
</button>

<button id="shuffleButton">
♻️
</button>

<script>

const canvas =
document.getElementById("canvas");

const ctx =
canvas.getContext("2d");

let W;
let H;

function resize(){

W = window.innerWidth;
H = window.innerHeight;

canvas.width = W;
canvas.height = H;

}

resize();

window.addEventListener(
"resize",
resize
);

const stageText =
document.getElementById(
"stage"
);

const scoreText =
document.getElementById(
"score"
);

const movesText =
document.getElementById(
"moves"
);

const shuffleText =
document.getElementById(
"shuffle"
);

const message =
document.getElementById(
"message"
);

const startButton =
document.getElementById(
"startButton"
);

const shuffleButton =
document.getElementById(
"shuffleButton"
);

const COLORS = [

"#ff595e",
"#ffca3a",
"#8ac926",
"#1982c4",
"#6a4c93"

];

const ROWS = 12;
const COLS = 8;

let CELL = 50;

let board = [];

let stage = 1;
let score = 0;

let moves = 30;
let shuffleCount = 3;

let running = false;

let boardX = 0;
let boardY = 90;

function updateLayout(){

CELL = Math.min(
60,
Math.floor(
W/(COLS+3)
)
);

boardX =
(W-(COLS*CELL))/2;

}

updateLayout();

window.addEventListener(
"resize",
updateLayout
);

function rand(max){

return Math.floor(
Math.random()*max
);

}

function randomColor(){

return COLORS[
rand(COLORS.length)
];

}

function inside(r,c){

return (
r>=0 &&
r<ROWS &&
c>=0 &&
c<COLS
);

}

function createBoard(){

board=[];

for(
let r=0;
r<ROWS;
r++
){

let row=[];

for(
let c=0;
c<COLS;
c++
){

if(r<5){

row.push(
randomColor()
);

}else{

row.push(null);

}

}

board.push(row);

}

guaranteedMatch();

}

function guaranteedMatch(){

let col =
rand(COLS-2);

let color =
randomColor();

board[4][col] = color;
board[4][col+1] = color;
board[4][col+2] = color;

}

function updateUI(){

stageText.textContent =
stage;

scoreText.textContent =
score;

movesText.textContent =
moves;

shuffleText.textContent =
shuffleCount;

}
