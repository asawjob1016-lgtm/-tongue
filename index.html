<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Chameleon's Tongue</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

html,body{
width:100%;
height:100%;
overflow:hidden;
font-family:sans-serif;
background:#eaf9ff;
}

#titleScreen{
position:fixed;
left:0;
top:0;
width:100%;
height:100%;
background:linear-gradient(
180deg,
#d8f7ff,
#ffffff
);
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
}

#gameTitle{
font-size:42px;
font-weight:bold;
color:#2d8f5a;
text-align:center;
margin-bottom:10px;
}

#subTitle{
font-size:22px;
color:#666;
margin-bottom:25px;
}

#titleCanvas{
width:340px;
height:240px;
max-width:90%;
}

#startBtn{
margin-top:20px;
padding:18px 50px;
font-size:28px;
font-weight:bold;
border:none;
border-radius:20px;
background:#37c96b;
color:white;
box-shadow:0 5px 15px rgba(0,0,0,.2);
}

#startBtn:active{
transform:scale(.95);
}

#gameScreen{
display:none;
width:100%;
height:100%;
}

#gameCanvas{
width:100%;
height:100%;
display:block;
background:#dff6ff;
}

#ui{
position:absolute;
top:10px;
left:10px;
z-index:100;
font-size:22px;
font-weight:bold;
color:#333;
}
</style>
</head>
<body>

<div id="titleScreen">

<div id="gameTitle">
Chameleon's Tongue
</div>

<div id="subTitle">
Bubble Puzzle
</div>

<canvas
id="titleCanvas"
width="400"
height="260">
</canvas>

<button id="startBtn">
START
</button>

</div>

<div id="gameScreen"></div>

<script>

const canvas =
document.getElementById("titleCanvas");

const ctx =
canvas.getContext("2d");

function drawGameChameleon(){

ctx.clearRect(
0,
0,
canvas.width,
canvas.height
);

ctx.save();

ctx.translate(40,20);

/* body */
ctx.fillStyle="#9be17f";
ctx.strokeStyle="#58a84a";
ctx.lineWidth=6;

ctx.beginPath();

ctx.moveTo(50,140);

ctx.quadraticCurveTo(
120,40,
250,80
);

ctx.quadraticCurveTo(
320,110,
280,160
);

ctx.quadraticCurveTo(
180,190,
80,170
);

ctx.closePath();

ctx.fill();
ctx.stroke();

/* tail */
ctx.beginPath();

ctx.arc(
40,
150,
35,
0,
Math.PI*2
);

ctx.stroke();

ctx.beginPath();

ctx.arc(
40,
150,
18,
0,
Math.PI*2
);

ctx.stroke();

/* eye */
ctx.fillStyle="white";

ctx.beginPath();
ctx.arc(
240,
90,
22,
0,
Math.PI*2
);
ctx.fill();

ctx.strokeStyle="#333";
ctx.stroke();

ctx.fillStyle="black";

ctx.beginPath();
ctx.arc(
245,
90,
6,
0,
Math.PI*2
);
ctx.fill();

/* tongue */
ctx.strokeStyle="#ff4d4d";
ctx.lineWidth=10;

ctx.beginPath();
ctx.moveTo(290,120);
ctx.lineTo(360,95);
ctx.stroke();

/* legs */
ctx.strokeStyle="#58a84a";
ctx.lineWidth=8;

ctx.beginPath();
ctx.moveTo(120,165);
ctx.lineTo(110,205);

ctx.moveTo(170,165);
ctx.lineTo(160,205);

ctx.moveTo(220,165);
ctx.lineTo(210,205);

ctx.moveTo(260,160);
ctx.lineTo(250,200);

ctx.stroke();

ctx.restore();

}

drawChameleon();

document
.getElementById("startBtn")
.addEventListener(
"click",
()=>{
document.getElementById("titleScreen").style.display="none";
document.getElementById("gameScreen").style.display="block";
startGame();
});
function startGame(){

document.getElementById("gameScreen")
.innerHTML=`

<div id="ui">
Tongue :
<span id="moves">30</span>
</div>

<canvas id="gameCanvas"></canvas>

`;

initGame();

}
let moves=30;

const COLORS=[
"#ff5a5a",
"#4dabff",
"#ffd43b",
"#69db7c",
"#c77dff"
];

let gameCanvas;
let gameCtx;

let bubbles=[];

const SIZE=48;

function initGame(){

gameCanvas =
document.getElementById("gameCanvas");

gameCtx =
gameCanvas.getContext("2d");

resize();

window.addEventListener(
"resize",
resize
);

createBoard();

canvas.addEventListener(
"click",
tapBubble
);

requestAnimationFrame(loop);

}
function resize(){

gameCanvas.width =
window.innerWidth;

gameCanvas.height =
window.innerHeight;

}
function createBoard(){

bubbles=[];

for(let row=0;row<5;row++){

for(let col=0;col<7;col++){

bubbles.push({

x:50+col*52,
y:120+row*52,

color:
COLORS[
Math.floor(
Math.random()*COLORS.length
)
]

});

}

}

}
function drawBubble(b){

gameCtx.beginPath();
gameCtx.fillStyle=b.color;

ctx.arc(
b.x,
b.y,
20,
0,
Math.PI*2
);

ctx.fill();

ctx.strokeStyle="white";
ctx.lineWidth=3;
ctx.stroke();

}
function drawGameChameleon(){

ctx.fillStyle="#8fdc77";

ctx.beginPath();

ctx.ellipse(
70,
canvas.height-70,
50,
35,
0,
0,
Math.PI*2
);

ctx.fill();

ctx.beginPath();

ctx.arc(
110,
canvas.height-90,
18,
0,
Math.PI*2
);

ctx.fill();

ctx.fillStyle="white";

ctx.beginPath();
ctx.arc(
115,
canvas.height-95,
12,
0,
Math.PI*2
);
ctx.fill();

ctx.fillStyle="black";

ctx.beginPath();
ctx.arc(
118,
canvas.height-95,
4,
0,
Math.PI*2
);
ctx.fill();

}
function tapBubble(e){

if(moves<=0)return;

const rect=
canvas.getBoundingClientRect();

const mx=
e.clientX-rect.left;

const my=
e.clientY-rect.top;

for(const b of bubbles){

const dx=mx-b.x;
const dy=my-b.y;

if(
Math.sqrt(dx*dx+dy*dy)
<20
){

moves--;

document.getElementById(
"moves"
).textContent=moves;

break;

}

}

}
function loop(){

ctx.clearRect(
0,
0,
canvas.width,
canvas.height
);

for(const b of bubbles){

drawBubble(b);

}

drawChameleon();

requestAnimationFrame(loop);

}
</script>

</body>
</html>
