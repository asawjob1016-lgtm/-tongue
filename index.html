<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">

<title>Chameleon's Tongue</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
overflow:hidden;
background:#dff6ff;
font-family:sans-serif;
touch-action:none;
}

canvas{
display:block;
background:linear-gradient(
to bottom,
#dff6ff,
#ffffff
);
}

#titleScreen{
position:absolute;
left:0;
top:0;
width:100%;
height:100%;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
background:white;
z-index:10;
}

#gameTitle{
font-size:48px;
font-weight:bold;
color:#2d8f2d;
margin-bottom:30px;
text-align:center;
}

#startBtn{
padding:18px 40px;
font-size:28px;
border:none;
border-radius:20px;
background:#32cd32;
color:white;
}

#ui{
position:absolute;
top:10px;
left:10px;
font-size:22px;
font-weight:bold;
display:none;
}

</style>
</head>
<body>

<div id="titleScreen">

<div id="gameTitle">
Chameleon's Tongue
</div>

<canvas
id="titleCanvas"
width="350"
height="250">
</canvas>

<br>

<button id="startBtn">
START
</button>

</div>

<div id="ui">
Tongue : <span id="moves">30</span>
</div>

<canvas id="gameCanvas"></canvas>

<script>

const canvas =
document.getElementById("gameCanvas");

const ctx =
canvas.getContext("2d");

function resize(){

canvas.width =
window.innerWidth;

canvas.height =
window.innerHeight;

}

resize();

window.addEventListener(
"resize",
resize
);
